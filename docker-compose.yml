services:
  app:
    build: .
    volumes:
      - ./:/app:cached
      - /app/node_modules
    ports:
      - '8080:8080'
      - '8081:8080'
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    stdin_open: true
    tty: true
